[build-system]
requires = ["maturin>=1.7,<2.0"]
build-backend = "maturin"

[project]
name = "xlsb_reader_rs"
version = "2.0.0"
description = "Rust backend for xlsb_reader: fast .xlsb/.xlsx/.xlsm parsing exposed as a Python extension module"
requires-python = ">=3.11"
license = {text = "MIT"}
keywords = ["excel", "xlsb", "spreadsheet", "formula", "rust"]
classifiers = [
    "Programming Language :: Rust",
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
]

[tool.maturin]
features = ["pyo3/extension-module"]
module-name = "xlsb_reader_rs"
manifest-path = "Cargo.toml"
