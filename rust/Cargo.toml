[package]
name = "xlsb_reader_rs"
version = "1.0.0-rc1"
edition = "2021"
description = "Rust backend for xlsb_reader: fast .xlsb/.xlsx/.xlsm parsing exposed as a Python extension module"
license = "MIT"

[lib]
name = "xlsb_reader_rs"
crate-type = ["cdylib"]

[dependencies]
cfb = "0.14.0"
pyo3 = { version = "0.29.0", features = ["extension-module", "abi3-py311"] }
quick-xml = "0.41.0"
regex = "1.13.1"
serde_json = "1.0.151"
zip = { version = "8.6.0", default-features = false, features = ["deflate"] }

[profile.release]
lto = true
codegen-units = 1
