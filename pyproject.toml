[project]
name = "xlsb_reader"
version = "2.1.0"
description = "Pure-Python reader for Excel Binary Workbook (.xlsb) files"
readme = "README.md"
requires-python = ">=3.11"
authors = [{name = "firstzero"}]
license = {text = "MIT"}
keywords = ["excel", "xlsb", "spreadsheet", "formula"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
]
dependencies = [
]

[project.optional-dependencies]
fast = ["xlsb_reader_rs==2.1.0"]

# For local development the native accelerator is built from the in-repo `rust/`
# crate. On PyPI, `xlsb_reader[fast]` resolves `xlsb_reader_rs` from the registry.
[tool.uv.sources]
xlsb_reader_rs = { path = "rust", editable = true }

[project.scripts]
xlsb_reader = "xlsb_reader._cli:main"
xlsb-extract-spec = "xlsb_reader._spec_extractor:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = ["pytest", "ruff", "pip-audit"]
